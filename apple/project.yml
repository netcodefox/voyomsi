# The Xcode project of VoyOMSI for iPhone, iPad and Mac (XcodeGen: `xcodegen` in this folder,
# or scripts/build-apple.sh, which also builds the game library). The .xcodeproj is made from
# this file and not kept in git.
#
# The game is the Rust library `voyomsi_game` (crates/omsi-app) built as a static library
# for each platform (scripts/build-apple.sh rust …) and linked into the Swift app; the Mac app
# carries the game program `voyomsi` beside the launcher as well (it runs every drive as a
# process of its own).
name: VoyOMSI
options:
  bundleIdPrefix: io.github.turbo-devv
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # (from scripts/build-apple.sh: the version of the commit, the Apple Developer team)
    MARKETING_VERSION: "${VOYOMSI_MARKETING_VERSION}"
    CURRENT_PROJECT_VERSION: "${VOYOMSI_BUILD_NUMBER}"
    DEVELOPMENT_TEAM: "${VOYOMSI_TEAM_ID}"
    CODE_SIGN_STYLE: Automatic
    PRODUCT_NAME: VoyOMSI
    PRODUCT_BUNDLE_IDENTIFIER: io.github.turbo-devv.voyomsi
    SWIFT_OBJC_BRIDGING_HEADER: Shared/Bridge/voyomsi.h
    # where cargo puts the game library (the repository's target folder unless the build says)
    VOYOMSI_RUST_TARGET: $(SRCROOT)/../target
    VOYOMSI_RUST_PROFILE: release
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  VoyOMSI-iOS:
    type: application
    platform: iOS
    sources:
      - Shared
      - iOS
      - Resources
    settings:
      base:
        INFOPLIST_FILE: iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/VoyOMSI.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        # (the game library is built for arm64 only: Apple silicon Macs run the Simulator)
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        OTHER_SWIFT_FLAGS: -Xcc -DVOYOMSI_IOS=1
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": '"$(VOYOMSI_RUST_TARGET)/aarch64-apple-ios/$(VOYOMSI_RUST_PROFILE)"'
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": '"$(VOYOMSI_RUST_TARGET)/aarch64-apple-ios-sim/$(VOYOMSI_RUST_PROFILE)"'
        OTHER_LDFLAGS: -lvoyomsi_game -lc++ -liconv -framework Metal -framework QuartzCore -framework UIKit -framework CoreGraphics -framework CoreAudio -framework AudioToolbox -framework AVFoundation -framework GameController -framework CoreMotion -framework Security -framework SystemConfiguration
    preBuildScripts:
      - name: Game library (Rust)
        script: '"$SRCROOT/../scripts/build-apple.sh" rust-for-xcode'
        basedOnDependencyAnalysis: false
  VoyOMSI-macOS:
    type: application
    platform: macOS
    sources:
      - Shared
      - macOS
      - Resources
    settings:
      base:
        INFOPLIST_FILE: macOS/Info.plist
        EXECUTABLE_NAME: VoyOMSI-Mac
        CODE_SIGN_ENTITLEMENTS: macOS/VoyOMSI.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        LIBRARY_SEARCH_PATHS: '"$(VOYOMSI_RUST_TARGET)/universal-apple-darwin/$(VOYOMSI_RUST_PROFILE)" "$(SRCROOT)/../assets/steam_redist"'
        LD_RUNPATH_SEARCH_PATHS: "@executable_path @executable_path/../Frameworks"
        OTHER_LDFLAGS: -lvoyomsi_game -lsteam_api -lc++ -liconv -framework Accelerate -framework AudioUnit -framework CoreAudio -framework QuartzCore -framework Metal -framework ApplicationServices -framework CoreGraphics -framework CoreVideo -framework Carbon -framework AppKit -framework GameController -framework IOKit
    preBuildScripts:
      - name: Game library (Rust)
        script: '"$SRCROOT/../scripts/build-apple.sh" rust-for-xcode'
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Game program beside the launcher
        script: '"$SRCROOT/../scripts/build-apple.sh" embed-game'
        basedOnDependencyAnalysis: false
schemes:
  VoyOMSI-iOS:
    build:
      targets:
        VoyOMSI-iOS: all
    run:
      config: Release
    archive:
      config: Release
  VoyOMSI-macOS:
    build:
      targets:
        VoyOMSI-macOS: all
    archive:
      config: Release
